name: plots_env

channels:
  - conda-forge
  - bioconda

dependencies:
  - r-base=4.2

  # Manipulación y plots
  - r-tidyverse
  - r-patchwork
  - r-circlize
  - r-cowplot
  - r-viridis
  - r-venndiagram
  - r-rcolorbrewer
  - r-matrixstats
  - r-ggrepel
  - r-yaml
  - r-pheatmap
  - r-scales

  # RNA-seq
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma

  # Enrichment y heatmaps
  - bioconductor-clusterprofiler
  - bioconductor-complexheatmap
  - bioconductor-enhancedvolcano