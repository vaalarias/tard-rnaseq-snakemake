# Snakemake profile for SGE (chaac cluster)
#
# Usage:
#   snakemake --profile profiles/sge -j 10 --use-conda --conda-frontend conda --rerun-incomplete
#
# This replaces the old SLURM CookieCutter profile. It reads each rule's
# `threads:` and `resources:` (mem_mb, time_min if defined) and submits
# one qsub job per Snakemake job via sge-submit.py, then polls job status
# via sge-status.py.

jobs: 10
local-cores: 1
latency-wait: 60
max-jobs-per-second: 5
max-status-checks-per-second: 5
keep-going: true
rerun-incomplete: true
printshellcmds: true
use-conda: true
conda-frontend: conda

cluster: "python3 profiles/sge/sge-submit.py"
cluster-status: "python3 profiles/sge/sge-status.py"
cluster-cancel: "qdel"

# Fallback resources for rules that don't specify their own
# (can be overridden per-rule with `resources: mem_mb=..., time_min=...`
# and `threads: N` inside each .smk rule)
default-resources:
  - mem_mb=4000
  - time_min=240
