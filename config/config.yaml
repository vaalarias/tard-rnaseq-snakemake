## Path to samplesheet and output directory
samplesheet: "data/samplesheet.csv"
outdir: "results"
logdir: "logs"

## Reference files
refs:
  genome_fa: "config/ref/GCF_019649055.1_Prichtersi_v1.0_genomic.fna"
  gtf: "config/ref/GCF_019649055.1_Prichtersi_v1.0_genomic.gtf"
  star_index: "config/ref/star_index"
  hisat_index: "config/ref/hisat_index"
  salmon_index: "config/ref/salmon_index"
  transcriptome_fa: "config/ref/GCF_019649055.1_Prichtersi_v1.0_rna.fna"
  decoy: "config/ref/decoys.txt"
  gentrome: "config/ref/gentrome.fa.gz"
  gaf: "config/ref/GCF_019649055.1-RS_2023_04_gene_ontology.gaf"
  remove_ids: "config/ref/remove_ids_060626.txt"

## Candidate reference genome assessment
reference_assessment:
  enabled: true

  candidates:
    Hyp_dujardini:
      fasta: "config/ref/candidates/Hyp_dujardini.fasta"
      accession: "GCA_001579985.1"

    Hyp_exemplaris:
      fasta: "config/ref/candidates/Hyp_exemplaris.fasta"
      accession: "GCA_002082055.1"

    Pam_metropolitanus:
      fasta: "config/ref/candidates/Pam_metropolitanus.fasta"
      accession: "GCF_019649055.1"

    Par_richtersi:
      fasta: "config/ref/candidates/Par_richtersi.fasta"
      accession: "GCA_034698045.1"

    Ram_varieornatus:
      fasta: "config/ref/candidates/Ram_varieornatus.fasta"
      accession: "GCA_001949185.1"

  busco:
    enabled: true
    lineage: "metazoa_odb10"
    mode: "genome"
    predictor: "metaeuk"

  trial_mapping:
    enabled: true
    aligner: "star"
    star_params: "--outSAMtype None"
    subsample_n: 2000000
    subsample_seed: 42

### Aligner and quantification specific parameters
aligner: "star"   # or  "hisat2"
salmon: true
params:
  star_sjdb_overhang: 100 # Index
  star: "--outSAMtype BAM SortedByCoordinate --outReadsUnmapped Fastx --alignEndsType Local --twopassMode Basic --outFilterMismatchNoverLmax 0.3 --outFilterScoreMinOverLread 0.3 --outFilterMatchNminOverLread 0.2 --outFilterMultimapNmax 200 --winAnchorMultimapNmax 200 --seedSearchStartLmax 15"
  hisat2: ""
  salmon: "--validateMappings --gcBias"
  salmon_k: 31
  featurecounts: "-p"

### Contamination screening parameters
kraken2:
  db: "/lustre/groups/ife/workspace/schneider/valentina.ojeda/db/custom"
  confidence: 0.05
  minimum_hit_group: 3
  bracken_level: "S"
  bracken_readlen: 100

### Blast parameters for descriptive screening
unmapped_reads:
  head_n: 25
  subsample_fraction: 0.05
  min_length: 50
  max_n_fraction: 0.10
  random_seed: 69
  max_base_fraction: 0.80
  
blast:
  samples:
    - EAO-1
    - EAO-2
    - EAO-3
    - ECO-3
    - ECO-4
    - ECO-5
    - GAB-1
    - GAB-2
    - GCB-1
    - GCO-1
    - GCB-2

  database: /export/storage/data/blast/db/nt
  task: megablast
  evalue: 1e-10
  max_target_seqs: 5

### Downstream Analysis Parameters
deseq2:
  counts_method: "featurecounts"  # "featurecounts" or "salmon"
  # Design formula (as used in DESeq2)
  design: "~ condition"
  contrasts:
   - ["condition", "anhydrobiosis", "control"]

  padj_threshold: 0.05
  log2fc_threshold: 1.6


### Parameters for visualizations
plots:
  general:
    width: 8          # inch
    height: 6         # inch
    dpi: 300
    font_size: 12
    showCategory: 15  

  colors:
    pca:
      group: ["#1b9e77", "#d95f02", "#7570b3"]  # colors by condition
    heatmap:
      low: "white"
      high: "#2166ac"
    volcano:
      sig_up: "#e41a1c"
      sig_down: "#377eb8"
      nonsig: "grey70"
    species:
        gadabouti: "#4b2588ff"
        experimentalis: "#56b4e9"

  species:
    - experimentalis
    - gadabouti

  epigenetic_families:
    - Polycomb
    - KDM
    - KMT
    - HAT
    - HDAC


